<!DOCTYPE html>
<html lang="bg">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Неофициални обобщения на броеве на Държавен вестник, генерирани с AI. Официален източник: dv.parliament.bg" />
    <meta name="theme-color" content="#1a1a1a" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/favicon.svg" />
    <title>Обобщения на Държавен вестник</title>
    <meta property="og:type" content="website" />
    <meta property="og:title" content="Обобщения на Държавен вестник" />
    <meta property="og:description" content="Неофициални обобщения на броеве на Държавен вестник. Официален източник: dv.parliament.bg" />
    <meta property="og:url" content="https://gazette.bg/" />
    <meta property="og:locale" content="bg_BG" />
    <link rel="preload" as="font" type="font/woff2" href="/fonts/source-sans-3-cyrillic.woff2" crossorigin />
    <link rel="stylesheet" href="/src/css/styles.css?v=2.2.0" />
    <script>
        if (/^\/issue\/\d+\/\d+\/?$/i.test(location.pathname)) {
            document.documentElement.classList.add('initial-issue-route');
        }
    </script>
</head>
<body>
    <header class="masthead">
        <div class="masthead-inner">
            <div class="masthead-eyebrow">
                <span>Неофициално · Обобщения с AI</span>
                <span>gazette.bg</span>
            </div>
            <div class="masthead-rule masthead-rule-top" aria-hidden="true"></div>
            <h1 class="masthead-title">Държавен вестник</h1>
            <p class="masthead-subtitle">Обобщения на броеве, генерирани с AI</p>
            <div class="masthead-rule masthead-rule-bottom" aria-hidden="true"></div>
            <p class="masthead-disclaimer">Този сайт не е официален и не е свързан с държавни органи. Обобщенията може да съдържат грешки. Официален източник: <a href="https://dv.parliament.bg" target="_blank" rel="noopener">dv.parliament.bg</a>.</p>
        </div>
    </header>
    <div class="layout">
        <main id="main">
            <div id="home-view" class="home-section">
                <div id="home-content"></div>
            </div>
            <div id="issue-view">
                <div class="read-progress-bar" id="read-progress-bar" role="progressbar" aria-label="Прогрес при четене" aria-valuemin="0" aria-valuemax="100">
                    <div class="read-progress-fill" id="read-progress-fill"></div>
                </div>
                <div class="back-bar">
                    <button type="button" class="back-btn" id="back-btn" aria-label="Обратно към началната страница">← Обратно към началната страница</button>
                </div>
                <div class="issue-header" id="issue-header"></div>
                <div class="content" id="content"></div>
                <div id="issue-nav" class="issue-nav issue-nav-bottom" aria-label="Навигация между броеве"></div>
                <div class="back-bar back-bar-bottom">
                    <button type="button" class="back-btn" id="back-btn-bottom" aria-label="Обратно към началната страница">← Обратно към началната страница</button>
                </div>
            </div>
            <div class="loading" id="loading" style="display:none;">Зареждане…</div>
        </main>
    </div>
    <button type="button" class="scroll-to-top" id="scroll-to-top" aria-label="Обратно нагоре" title="Обратно нагоре">↑</button>
    <script defer src="https://cdn.jsdelivr.net/npm/marked@17/lib/marked.umd.js"></script>
    <script defer src="/src/js/app.js?v=2.3.0"></script>
</body>
</html>
