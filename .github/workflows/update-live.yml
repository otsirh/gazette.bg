name: Update live.gazette.bg

on:
  workflow_dispatch: {}
  schedule:
    # Every 20 minutes. GitHub may start a scheduled run some minutes late
    # when it is busy; the next one catches up.
    - cron: '*/20 * * * *'

# Two updates must not publish over each other: each reads the state the
# last one published.
concurrency:
  group: update-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No dependency needs an install script, and the job holds secrets.
      - run: npm ci --ignore-scripts

      - name: Check the settings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          for v in ANTHROPIC_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LIVE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (see live/README.md)."; exit 1; }
          done

      # Reads the state the site last published, adds what is new, and builds
      # dist-live/. If the published state cannot be read (anything but "not
      # there yet"), it stops rather than start over from nothing.
      - name: Update
        run: node live/update.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          LIVE_STATE_URL: ${{ vars.LIVE_URL }}/state.json
          LIVE_MONTHLY_BUDGET: ${{ vars.LIVE_MONTHLY_BUDGET || '40' }}

      # Wrangler is pinned here rather than in package.json: only this job
      # needs it. The site is a Worker serving dist-live/ as static assets on
      # live.gazette.bg (live/wrangler.jsonc).
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.169.0 deploy --config live/wrangler.jsonc
