name: Update live.gazette.bg

on:
  workflow_dispatch: {}
  schedule:
    # Every 10 minutes. GitHub starts scheduled runs late, and at busy times
    # skips some altogether; asking twice as often keeps the gap short. A run
    # with nothing new costs a cent at most.
    - cron: '*/10 * * * *'

# Two updates must not publish over each other: each reads the state the
# last one published.
concurrency:
  group: update-live
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      # No dependency needs an install script, and the job holds secrets.
      - run: npm ci --ignore-scripts

      - name: Check the settings
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          LIVE_URL: ${{ vars.LIVE_URL }}
        run: |
          for v in ANTHROPIC_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID LIVE_URL; do
            [ -n "${!v}" ] || { echo "::error::$v is not set (see live/README.md)."; exit 1; }
          done

      # A few sites turn away addresses outside Bulgaria, so those are read
      # through the Mac mini at home, an exit node on our tailnet (as in
      # update-gazette.yml). Unlike there, a Mac mini that is asleep or away
      # does not stop the update: LIVE_PROXY is set only when it answers, and
      # without it those sources are skipped this time.
      - name: Connect to the exit node in Bulgaria
        id: tailscale
        continue-on-error: true
        timeout-minutes: 3
        env:
          TS_VERSION: '1.104.4'
          TS_SHA256: 624ea093d47d62cf56f17b8332d74b8decda4a1faa610ebc60a1de334b2b3dc9
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_EXIT_NODE: ${{ vars.TS_EXIT_NODE }}
        run: |
          [ -n "$TS_OAUTH_SECRET" ] || { echo "::warning::TS_OAUTH_SECRET is not set; sources via Bulgaria are skipped."; exit 1; }
          cd /tmp
          curl -fsSL -o tailscale.tgz "https://pkgs.tailscale.com/stable/tailscale_${TS_VERSION}_amd64.tgz"
          echo "${TS_SHA256}  tailscale.tgz" | sha256sum -c -
          tar -xzf tailscale.tgz --strip-components=1
          nohup ./tailscaled --tun=userspace-networking --state=mem: --socket=/tmp/tailscaled.sock \
            --socks5-server=127.0.0.1:1055 > tailscaled.log 2>&1 &
          for i in $(seq 20); do [ -S /tmp/tailscaled.sock ] && break; sleep 1; done
          ./tailscale --socket=/tmp/tailscaled.sock up \
            --auth-key="${TS_OAUTH_SECRET}?ephemeral=true&preauthorized=true" --advertise-tags=tag:ci \
            --hostname="live-ci-${GITHUB_RUN_ID}" --accept-dns=false --timeout=1m
          ./tailscale --socket=/tmp/tailscaled.sock set --exit-node="${TS_EXIT_NODE}"
          if curl -sS -o /dev/null --socks5-hostname 127.0.0.1:1055 --max-time 20 https://www.capital.bg/rss/; then
            echo "LIVE_PROXY=socks5://127.0.0.1:1055" >> "$GITHUB_ENV"
          else
            echo "::warning::The Mac mini (${TS_EXIT_NODE}) did not answer; sources via Bulgaria are skipped."
            exit 1
          fi

      # Reads the state the site last published, adds what is new, and builds
      # dist-live/. If the published state cannot be read (anything but "not
      # there yet"), it stops rather than start over from nothing.
      - name: Update
        run: node live/update.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
          LIVE_STATE_URL: ${{ vars.LIVE_URL }}/state.json
          LIVE_MONTHLY_BUDGET: ${{ vars.LIVE_MONTHLY_BUDGET || '40' }}
          LIVE_CONTACT: ${{ vars.LIVE_CONTACT }}
          LIVE_OPERATOR: ${{ vars.LIVE_OPERATOR }}
          LIVE_ADDRESS: ${{ vars.LIVE_ADDRESS }}

      # Stories that left the page, kept for the record (what was said, from
      # which headlines and links) in case a claim is ever questioned.
      - name: Keep the record of retired stories
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: live-evidence-${{ github.run_id }}
          path: .evidence/
          if-no-files-found: ignore
          retention-days: 90

      # Wrangler is pinned here rather than in package.json: only this job
      # needs it. The site is a Worker serving dist-live/ as static assets on
      # live.gazette.bg (live/wrangler.jsonc).
      - name: Publish
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --yes wrangler@4.169.0 deploy --config live/wrangler.jsonc
