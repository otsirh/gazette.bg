name: Update Gazette

on:
  workflow_dispatch: {}
  schedule:
    # Run daily at 12:00 UTC
    - cron: '0 12 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        # Single source of truth for the Playwright version. Run inside
        # Playwright's official image so Chromium + its system deps are baked
        # in (no flaky CDN download to hang on). The guard step below fails the
        # run if this drifts from package-lock.json, so you can't forget.
        playwright-version: ['1.58.1']
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright-version }}-noble
    permissions:
      contents: write  # needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright version matches the container image
        run: |
          LOCKED=$(node -e "console.log(require('playwright/package.json').version)")
          if [ "$LOCKED" != "${{ matrix.playwright-version }}" ]; then
            echo "::error::package-lock.json has playwright $LOCKED but the container image is v${{ matrix.playwright-version }}. Set playwright-version in .github/workflows/update-gazette.yml to $LOCKED."
            exit 1
          fi
          echo "Playwright $LOCKED matches the container image."

      - name: Run update-gazette
        run: npm run update-gazette
        env:
          HEADLESS: 'true'
          # Browsers are pre-installed here in the image.
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SEND_ALERT_EMAILS: ${{ secrets.SEND_ALERT_EMAILS }}

      - name: Commit and push if there are changes
        run: |
          # Avoid git "dubious ownership" inside the container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No files to commit."
          else
            COMMIT_DATE=$(date +"%Y-%m-%d")
            git commit -m "Update gazette: new issues and catalog ($COMMIT_DATE)"
            git push
          fi
