name: Update Gazette

on:
  workflow_dispatch: {}
  schedule:
    # Run daily at 12:00 UTC
    - cron: '0 12 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      - name: Install Playwright Chromium
        timeout-minutes: 8
        run: |
          # Retry with a per-attempt timeout so a stalled CDN download gets
          # killed and retried instead of hanging until the step cap.
          for attempt in 1 2 3; do
            echo "Playwright install attempt $attempt..."
            if timeout 150 npx playwright install chromium; then
              echo "Playwright install succeeded."
              exit 0
            fi
            echo "Attempt $attempt failed or timed out; retrying in 10s..."
            sleep 10
          done
          echo "Playwright install failed after 3 attempts." >&2
          exit 1

      - name: Run update-gazette
        run: npm run update-gazette
        env:
          HEADLESS: 'true'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SEND_ALERT_EMAILS: ${{ secrets.SEND_ALERT_EMAILS }}

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No files to commit."
          else
            COMMIT_DATE=$(date +"%Y-%m-%d")
            git commit -m "Update gazette: new issues and catalog ($COMMIT_DATE)"
            git push
          fi
