name: Update Gazette

on:
  workflow_dispatch: {}
  schedule:
    # Run daily at 12:00 UTC
    - cron: '0 12 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    # Run inside Playwright's official image: Chromium and its system deps are
    # baked in, so there is no flaky CDN download to hang on. The tag MUST match
    # the playwright version in package-lock.json (1.58.1).
    container:
      image: mcr.microsoft.com/playwright:v1.58.1-noble
    permissions:
      contents: write  # needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run update-gazette
        run: npm run update-gazette
        env:
          HEADLESS: 'true'
          # Browsers are pre-installed here in the image.
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SEND_ALERT_EMAILS: ${{ secrets.SEND_ALERT_EMAILS }}

      - name: Commit and push if there are changes
        run: |
          # Avoid git "dubious ownership" inside the container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No files to commit."
          else
            COMMIT_DATE=$(date +"%Y-%m-%d")
            git commit -m "Update gazette: new issues and catalog ($COMMIT_DATE)"
            git push
          fi
