name: Update Gazette

on:
  workflow_dispatch: {}
  schedule:
    # Run daily at 12:00 UTC
    - cron: '0 12 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write  # needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('package-lock.json') }}

      # apt packages are not part of the cached browser dir, so install them
      # on every run regardless of cache state.
      - name: Install Playwright system deps
        timeout-minutes: 5
        run: npx playwright install-deps chromium

      - name: Download Playwright Chromium
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        timeout-minutes: 16
        # Azure-hosted runners frequently blackhole IPv6 to the Playwright
        # CDN, which makes the browser download hang forever. Force IPv4.
        env:
          NODE_OPTIONS: --dns-result-order=ipv4first
        run: |
          # Each attempt is hard-killed (SIGKILL) after 5 min so a stalled
          # download actually dies and the retry starts fresh.
          for attempt in 1 2 3; do
            echo "Chromium download attempt $attempt..."
            if timeout --signal=KILL 300 npx playwright install chromium; then
              echo "Chromium download succeeded."
              exit 0
            fi
            echo "Attempt $attempt failed or timed out; retrying in 15s..."
            sleep 15
          done
          echo "Chromium download failed after 3 attempts." >&2
          exit 1

      - name: Run update-gazette
        run: npm run update-gazette
        env:
          HEADLESS: 'true'
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
          ALERT_EMAIL: ${{ secrets.ALERT_EMAIL }}
          SEND_ALERT_EMAILS: ${{ secrets.SEND_ALERT_EMAILS }}

      - name: Commit and push if there are changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No files to commit."
          else
            COMMIT_DATE=$(date +"%Y-%m-%d")
            git commit -m "Update gazette: new issues and catalog ($COMMIT_DATE)"
            git push
          fi
