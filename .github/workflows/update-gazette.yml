name: Update Gazette

on:
  workflow_dispatch: {}
  schedule:
    # Daily at 12:00 UTC, and again at 17:00 UTC for a day dv.parliament.bg
    # did not answer at noon. A run with nothing new is done in a minute.
    - cron: '0 12 * * *'
    - cron: '0 17 * * *'

# A manual run and the scheduled one must not race each other to push.
concurrency:
  group: update-gazette
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The update runs inside Playwright's official image, so Chromium and its
  # system dependencies are baked in (no flaky browser download to hang on).
  # The image has to match the Playwright in package-lock.json; reading the
  # version from there means a dependency update moves both at once.
  playwright-version:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      version: ${{ steps.lock.outputs.version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - id: lock
        run: echo "version=$(jq -r '.packages["node_modules/playwright"].version' package-lock.json)" >> "$GITHUB_OUTPUT"

  update:
    needs: playwright-version
    runs-on: ubuntu-latest
    timeout-minutes: 90
    container:
      image: mcr.microsoft.com/playwright:v${{ needs.playwright-version.outputs.version }}-noble
    permissions:
      contents: write  # needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Since 26 October 2026 dv.parliament.bg answers only Bulgarian
      # addresses, so the browser goes out through the Mac mini at home: an
      # exit node on our tailnet. The container has no TUN device, so
      # tailscaled runs in userspace and gives the browser a SOCKS5 proxy;
      # the Claude API, npm and git still go out directly. Dependabot does not
      # see this pin: bump TS_VERSION and TS_SHA256 together, both from
      # https://pkgs.tailscale.com/stable/.
      - name: Connect to the exit node in Bulgaria
        env:
          TS_VERSION: '1.104.4'
          TS_SHA256: 624ea093d47d62cf56f17b8332d74b8decda4a1faa610ebc60a1de334b2b3dc9
          TS_OAUTH_SECRET: ${{ secrets.TS_OAUTH_SECRET }}
          TS_EXIT_NODE: ${{ vars.TS_EXIT_NODE }}
        run: |
          [ -n "$TS_OAUTH_SECRET" ] || { echo "::error::The TS_OAUTH_SECRET secret is missing or empty."; exit 1; }
          cd /tmp
          curl -fsSL -o tailscale.tgz "https://pkgs.tailscale.com/stable/tailscale_${TS_VERSION}_amd64.tgz"
          echo "${TS_SHA256}  tailscale.tgz" | sha256sum -c -
          tar -xzf tailscale.tgz --strip-components=1
          nohup ./tailscaled --tun=userspace-networking --state=mem: --socket=/tmp/tailscaled.sock \
            --socks5-server=127.0.0.1:1055 > tailscaled.log 2>&1 &
          for i in $(seq 20); do [ -S /tmp/tailscaled.sock ] && break; sleep 1; done
          # An OAuth client secret serves as the auth key; the node is
          # ephemeral, so it leaves the tailnet on its own after the run.
          ./tailscale --socket=/tmp/tailscaled.sock up \
            --auth-key="${TS_OAUTH_SECRET}?ephemeral=true&preauthorized=true" --advertise-tags=tag:ci \
            --hostname="gazette-ci-${GITHUB_RUN_ID}" --accept-dns=false --timeout=2m
          # By name, the exit node can be chosen only once the node is up.
          ./tailscale --socket=/tmp/tailscaled.sock set --exit-node="${TS_EXIT_NODE}"
          # Say why here, rather than after three list-page timeouts.
          if ! curl -sS -o /dev/null --socks5-hostname 127.0.0.1:1055 --max-time 30 https://dv.parliament.bg/; then
            echo "::error::dv.parliament.bg did not answer through ${TS_EXIT_NODE}. Is the Mac mini awake and on Tailscale?"
            exit 1
          fi

      - name: Run update-gazette
        run: npm run update-gazette
        env:
          HEADLESS: 'true'
          DV_PROXY: socks5://127.0.0.1:1055
          # Browsers are pre-installed here in the image.
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # When the scrape stalls, the script leaves the page it saw behind. Keep
      # it: it is the only look at dv.parliament.bg the next fix will get.
      - name: Upload scrape diagnostics
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gazette-scrape-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      # Runs after a failed update too: a failed issue is reverted on disk, so
      # what is left is complete issues, and one bad issue must not hold back
      # the others. The run itself still ends red.
      - name: Commit and push if there are changes
        if: ${{ !cancelled() }}
        run: |
          # Avoid git "dubious ownership" inside the container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No files to commit."
            exit 0
          fi
          COMMIT_DATE=$(date +"%Y-%m-%d")
          git commit -m "Update gazette: new issues ($COMMIT_DATE)"
          # main may have advanced since checkout; rebase and retry the push.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest main..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "Failed to push after rebase retries." >&2
          exit 1
