name: Update Gazette

on:
  workflow_dispatch: {}
  schedule:
    # Run daily at 12:00 UTC
    - cron: '0 12 * * *'

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      matrix:
        # Single source of truth for the Playwright version. Run inside
        # Playwright's official image so Chromium + its system deps are baked
        # in (no flaky CDN download to hang on). The guard step below fails the
        # run if this drifts from package-lock.json, so you can't forget.
        playwright-version: ['1.58.1']
    container:
      image: mcr.microsoft.com/playwright:v${{ matrix.playwright-version }}-noble
    permissions:
      contents: write  # needed to push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6.0.2

      - name: Setup Node.js
        uses: actions/setup-node@v6.4.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Verify Playwright version matches the container image
        run: |
          LOCKED=$(node -e "console.log(require('playwright/package.json').version)")
          if [ "$LOCKED" != "${{ matrix.playwright-version }}" ]; then
            echo "::error::package-lock.json has playwright $LOCKED but the container image is v${{ matrix.playwright-version }}. Set playwright-version in .github/workflows/update-gazette.yml to $LOCKED."
            exit 1
          fi
          echo "Playwright $LOCKED matches the container image."

      - name: Run update-gazette
        run: npm run update-gazette
        env:
          HEADLESS: 'true'
          # Browsers are pre-installed here in the image.
          PLAYWRIGHT_BROWSERS_PATH: /ms-playwright
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      # When the scrape stalls, the script leaves the page it saw behind. Keep
      # it: it is the only look at dv.parliament.bg the next fix will get.
      - name: Upload scrape diagnostics
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: gazette-scrape-diagnostics
          path: diagnostics/
          if-no-files-found: ignore
          retention-days: 14

      # Runs after a failed update too: a failed issue is reverted on disk, so
      # what is left is complete issues, and one bad issue must not hold back
      # the others. The run itself still ends red.
      - name: Commit and push if there are changes
        if: ${{ !cancelled() }}
        run: |
          # Avoid git "dubious ownership" inside the container.
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --staged --quiet; then
            echo "No files to commit."
            exit 0
          fi
          COMMIT_DATE=$(date +"%Y-%m-%d")
          git commit -m "Update gazette: new issues ($COMMIT_DATE)"
          # main may have advanced since checkout; rebase and retry the push.
          for attempt in 1 2 3; do
            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi
            echo "Push rejected (attempt $attempt); rebasing onto latest main..."
            git pull --rebase --autostash origin "${GITHUB_REF_NAME}"
          done
          echo "Failed to push after rebase retries." >&2
          exit 1
